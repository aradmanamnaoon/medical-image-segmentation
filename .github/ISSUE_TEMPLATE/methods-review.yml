name: Source-level methods review
description: Give grounded feedback on the published MRI segmentation code without sharing sensitive patient data.
title: "[Methods] "
body:
  - type: markdown
    attributes:
      value: |
        Please inspect the [ten-minute reviewer guide](../../docs/REVIEWER_GUIDE.md) first.
        **Do not upload patient images, patient identifiers, private checkpoints, or restricted datasets.** Your report may be entirely source-based.
  - type: dropdown
    id: focus
    attributes:
      label: Review focus
      options:
        - Patient/case-level split integrity
        - Image-label alignment and preprocessing
        - Model architecture or loss implementation
        - Validation and checkpoint provenance
        - Reproducibility, licenses, or runtime environment
        - Other source-level issue
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Code file / evidence link (when relevant)
      placeholder: "src/dataset.py or a specific source URL"
    validations:
      required: false
  - type: textarea
    id: observation
    attributes:
      label: Reproducible observation, concern, or question
      description: Use code snippets or invented examples only. Do not include private patient data.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested verification or fix
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-report safety
      options:
        - label: I have not included any patient-identifying, proprietary, or restricted information.
          required: true
